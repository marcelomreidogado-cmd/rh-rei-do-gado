<!doctype html><html><head><meta charset="utf-8"><title>WhatsApp (simulado)</title>
<style>#editor{position:fixed;inset:0;background:#fff}footer{position:fixed;bottom:0;left:300px;right:0}[contenteditable]{min-height:20px;border:1px solid #ccc}</style></head>
<body>
<!-- Simula o WhatsApp Web: busca da lateral (contenteditable), conversa carrega depois, colar imagem abre o editor com legenda -->
<div id="side"><div contenteditable="true" id="busca" role="textbox" aria-label="Pesquisar"></div></div>
<div id="main"></div>
<script>
window.__sent = [];
setTimeout(() => {
  const m = document.getElementById('main');
  m.innerHTML = '<header>Conversa ' + new URLSearchParams(location.search).get('phone') + '</header><footer><div contenteditable="true" role="textbox" id="comp" aria-label="Digite uma mensagem"></div><span data-icon="mic" id="mic">mic</span><button id="sendmsg" aria-label="Enviar" style="display:none"><span data-icon="send">→</span></button></footer>';
  const comp = document.getElementById('comp'), sendmsg = document.getElementById('sendmsg');
  comp.addEventListener('input', () => { sendmsg.style.display = comp.textContent.trim() ? '' : 'none'; });
  sendmsg.addEventListener('click', () => { window.__sent.push({ tipo: 'texto', texto: comp.textContent }); comp.textContent = ''; sendmsg.style.display = 'none'; });
  comp.addEventListener('paste', (e) => {
    const f = e.clipboardData && e.clipboardData.files[0]; if (!f) return; e.preventDefault();
    setTimeout(() => {
      const ed = document.createElement('div'); ed.id = 'editor';
      ed.innerHTML = '<img id="prev"><div contenteditable="true" role="textbox" id="leg" aria-label="Adicione uma legenda"></div><div role="button" aria-label="Enviar" id="envimg"><span data-icon="wds-ic-send-filled">➤</span></div>';
      document.body.appendChild(ed);
      document.getElementById('prev').src = URL.createObjectURL(f);
      document.getElementById('envimg').addEventListener('click', () => { window.__sent.push({ tipo: 'imagem', nome: f.name, tipoArq: f.type, tamanho: f.size, legenda: document.getElementById('leg').textContent }); setTimeout(() => ed.remove(), 300); });
    }, 500);
  });
}, 1500);
</script></body></html>
